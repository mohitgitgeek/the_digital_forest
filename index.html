<!DOCTYPE html>
<html>
<head>
    <title>The Digital Forest</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-top: 20px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 5px;
        }

        .tile {
            width: 60px;
            height: 60px;
            border: 1px solid #00ff00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s;
        }

        .stats {
            background: #000;
            padding: 20px;
            border: 1px solid #00ff00;
        }

        .progress-bar {
            height: 20px;
            background: #333;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: #00ff00;
            transition: width 0.3s;
        }

        .controls {
            margin: 20px 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        button {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:hover:enabled {
            background: #00ff0022;
        }

        #message-log {
            height: 150px;
            overflow-y: auto;
            border: 1px solid #00ff00;
            padding: 10px;
            margin-top: 20px;
            width: 100%;
            max-width: 700px;
            background: #111;
        }
    </style>
</head>
<body>
    <h1>🌲 The Digital Forest 🌲</h1>
    <div id="game-container">
        <div>
            <div id="grid"></div>
            <div class="controls">
                <button onclick="move('up')">↑ Up</button>
                <button onclick="move('left')">← Left</button>
                <button onclick="move('right')">→ Right</button>
                <button onclick="move('down')">↓ Down</button>
            </div>
        </div>
        <div class="stats">
            <h3>Round: <span id="round">1</span>/20</h3>
            <div>Health: <span id="health">100</span></div>
            <div class="progress-bar"><div id="health-bar" class="progress-fill" style="width: 100%"></div></div>
            <div>Energy: <span id="energy">100</span></div>
            <div class="progress-bar"><div id="energy-bar" class="progress-fill" style="width: 100%"></div></div>
            <h4>Legend</h4>
            <div>🌿: Grass</div>
            <div>💧: Water</div>
            <div>🌳: Tree</div>
            <div>☠️: Danger</div>
            <div>🚧: Obstacle</div>
            <div>🍎: Fruit</div>
        </div>
    </div>
    <div id="message-log"></div>

    <script>
        // --- Constants ---
        const GRID_SIZE = 15;
        const VISIBILITY = 3;
        const ROUNDS = 20;
        const HEALTH_THRESHOLD = 50;
        const ENERGY_THRESHOLD = 50;
        const TERRAIN_SHIFT_MOVES = 5;

        // --- Tile Effects & Icons ---
        const TILE_EFFECTS = {
            "G": { health: 0, energy: 0, name: "Grass", icon: "🌿" },
            "W": { health: 0, energy: +10, name: "Water", icon: "💧" },
            "T": { health: 0, energy: 0, name: "Tree", icon: "🌳" },
            "DZ": { health: -20, energy: -10, name: "Danger Zone", icon: "☠️" },
            "O": { health: -5, energy: -5, name: "Obstacle", icon: "🚧" },
            "F": { health: +15, energy: +15, name: "Fruit", icon: "🍎" }
        };

        // --- Game State ---
        let playerHealth = 100;
        let playerEnergy = 100;
        let playerPosition = [7, 7];
        let movesCounter = 0;
        let roundNum = 1;
        let grid = [];
        let gameOver = false;

        // --- Grid Generation ---
        function createGrid() {
            const tiles = Object.keys(TILE_EFFECTS);
            const weights = [0.4, 0.15, 0.1, 0.1, 0.1, 0.15];
            let result = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                let row = [];
                for (let j = 0; j < GRID_SIZE; j++) {
                    let r = Math.random();
                    let acc = 0;
                    for (let k = 0; k < tiles.length; k++) {
                        acc += weights[k];
                        if (r < acc) {
                            row.push(tiles[k]);
                            break;
                        }
                    }
                }
                result.push(row);
            }
            return result;
        }

        // --- Terrain Shifting ---
        function shiftTerrain() {
            const specialTiles = ["W", "T", "F", "DZ"];
            // Clear old special tiles
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (specialTiles.includes(grid[i][j])) {
                        grid[i][j] = "G";
                    }
                }
            }
            // Place new special tiles
            for (let tile of specialTiles) {
                let count = Math.floor(Math.random() * 6) + 5; // 5-10
                for (let c = 0; c < count; c++) {
                    let x, y;
                    do {
                        x = Math.floor(Math.random() * GRID_SIZE);
                        y = Math.floor(Math.random() * GRID_SIZE);
                    } while ((x === playerPosition[0] && y === playerPosition[1]) || grid[x][y] !== "G");
                    grid[x][y] = tile;
                }
            }
            logMessage("🌲 Terrain has shifted! Special tiles have moved.");
        }

        // --- Visible Area ---
        function getVisibleArea() {
            let area = [];
            let [px, py] = playerPosition;
            for (let i = px - 1; i <= px + 1; i++) {
                let row = [];
                for (let j = py - 1; j <= py + 1; j++) {
                    if (i === px && j === py) {
                        row.push("P");
                    } else if (i >= 0 && i < GRID_SIZE && j >= 0 && j < GRID_SIZE) {
                        row.push(grid[i][j]);
                    } else {
                        row.push(null); // Out of bounds
                    }
                }
                area.push(row);
            }
            return area;
        }

        // --- Display Functions ---
        function updateDisplay() {
            // Update stats
            document.getElementById("health").textContent = playerHealth;
            document.getElementById("energy").textContent = playerEnergy;
            document.getElementById("round").textContent = roundNum;
            document.getElementById("health-bar").style.width = Math.max(0, playerHealth) + "%";
            document.getElementById("energy-bar").style.width = Math.max(0, playerEnergy) + "%";

            // Update grid
            const gridDiv = document.getElementById("grid");
            gridDiv.innerHTML = "";
            let visible = getVisibleArea();
            for (let i = 0; i < visible.length; i++) {
                for (let j = 0; j < visible[i].length; j++) {
                    let tileCode = visible[i][j];
                    let tileDiv = document.createElement("div");
                    tileDiv.className = "tile";
                    if (tileCode === "P") {
                        tileDiv.style.background = "#00ff00";
                        tileDiv.style.color = "#000";
                        tileDiv.textContent = "🧑";
                    } else if (tileCode === null) {
                        tileDiv.textContent = "";
                        tileDiv.style.background = "#222";
                    } else {
                        tileDiv.textContent = TILE_EFFECTS[tileCode].icon;
                    }
                    gridDiv.appendChild(tileDiv);
                }
            }
        }

        // --- Message Log ---
        function logMessage(msg) {
            const logDiv = document.getElementById("message-log");
            logDiv.innerHTML += msg + "<br>";
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // --- Tile Interaction ---
        function interactWithTile() {
            let [x, y] = playerPosition;
            let tile = grid[x][y];
            let effects = TILE_EFFECTS[tile];
            playerHealth += effects.health;
            playerEnergy += effects.energy;

            if (tile === "T") {
                // Shouldn't happen, but just in case
                logMessage("You bumped into a tree. Movement blocked!");
                return;
            }

            logMessage(`You stepped on a '${effects.name}' tile.`);
            if (effects.health < 0 || effects.energy < 0) {
                logMessage(`Lost ${Math.abs(effects.health)} health and ${Math.abs(effects.energy)} energy.`);
            }
            if (effects.health > 0 || effects.energy > 0) {
                logMessage(`Gained ${effects.health} health and ${effects.energy} energy.`);
            }

            // Cap values
            playerHealth = Math.max(0, Math.min(100, playerHealth));
            playerEnergy = Math.max(0, Math.min(100, playerEnergy));
        }

        // --- Movement ---
        function move(direction) {
            if (gameOver || roundNum > ROUNDS) return; // Prevent moves after game ends

            const moves = {
                "up": [-1, 0],
                "down": [1, 0],
                "left": [0, -1],
                "right": [0, 1]
            };
            let [dx, dy] = moves[direction];
            let [x, y] = playerPosition;
            let nx = x + dx, ny = y + dy;

            if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) {
                logMessage("Cannot move outside the forest boundaries!");
                return;
            }
            if (grid[nx][ny] === "T") {
                logMessage("Movement blocked by a tree!");
                return;
            }

            playerPosition = [nx, ny];
            movesCounter += 1;

            // Terrain shift
            if (movesCounter % TERRAIN_SHIFT_MOVES === 0) {
                shiftTerrain();
            }

            // Next round
            roundNum += 1;
            interactWithTile();
            updateDisplay();

            // Check end conditions
            if (playerHealth < HEALTH_THRESHOLD || playerEnergy < ENERGY_THRESHOLD) {
                logMessage("<b>Game Over! You failed to maintain sufficient health or energy.</b>");
                gameOver = true;
                disableControls();
                return;
            }
            if (roundNum > ROUNDS) {
                logMessage("<b>Congratulations! You survived The Digital Forest!</b>");
                gameOver = true;
                disableControls();
                return;
            }
        }

        // --- Controls ---
        function disableControls() {
            let btns = document.querySelectorAll(".controls button");
            btns.forEach(btn => btn.disabled = true);
        }

        // --- Keyboard Support ---
        document.addEventListener("keydown", function(e) {
            if (gameOver || roundNum > ROUNDS) return;
            if (e.key === "ArrowUp") move("up");
            if (e.key === "ArrowDown") move("down");
            if (e.key === "ArrowLeft") move("left");
            if (e.key === "ArrowRight") move("right");
        });

        // --- Game Initialization ---
        function startGame() {
            grid = createGrid();
            playerHealth = 100;
            playerEnergy = 100;
            playerPosition = [7, 7];
            movesCounter = 0;
            roundNum = 1;
            gameOver = false;
            document.getElementById("message-log").innerHTML = "<b>Welcome to The Digital Forest!</b><br>Navigate through the forest while maintaining at least 50% health and energy.<br>Special tiles (Water/Tree/Fruit/Danger Zone) will shift positions every five moves!<br>";
            let btns = document.querySelectorAll(".controls button");
            btns.forEach(btn => btn.disabled = false);
            updateDisplay();
            interactWithTile();
            updateDisplay();
        }

        window.onload = startGame;
    </script>
</body>
</html>
